services:
  # ==============================================================================
  # Container 1: Production-Grade Relational Database Engine (PostgreSQL)
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: smart_monitor_db
    restart: always
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: secure_devops_pass
      POSTGRES_DB: monitor_db
    ports:
      - "5432:5432"
    volumes:
      # Named persistent volume to guard historical node data from container teardowns
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitor_network

  # ==============================================================================
  # Container 2: Flask Telemetry API Engine & Core Business Logic Layer
  # ==============================================================================
  # [MODIFIED]: Renamed context block from generic 'backend' to match your folder 'dashboard'
  dashboard:
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    container_name: smart_monitor_dashboard
    restart: always
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres_admin
      - POSTGRES_PASSWORD=secure_devops_pass
      - POSTGRES_DB=monitor_db
      - POSTGRES_PORT=5432
      - JWT_SECRET_KEY=super_secure_telemetry_secret_key_2026
      # Securely read notification parameters from host environment variables (.env)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_TO=${EMAIL_TO}
    depends_on:
      # Ensures database schema engine boots up before spawning API socket interfaces
      - db
    networks:
      - monitor_network

  # ==============================================================================
  # Container 3: Enterprise Nginx Reverse Proxy Server (SPA Integrator)
  # ==============================================================================
  # [ADDED]: Injects Nginx to route static client templates and map /api routes cleanly
  proxy_server:
    image: nginx:alpine
    container_name: smart_monitor_proxy
    ports:
      - "80:80"
    volumes:
      # Binds your template directory directly into Nginx HTML static root space
      - ./dashboard/templates:/usr/share/nginx/html
      # Maps custom styles/scripts assets if utilized down the pipeline
      - ./dashboard/static:/usr/share/nginx/html/static
      # Mounts the architectural Nginx configuration file generated on the host
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      # Ensures the core data ingestion engine is running before intercepting traffic
      - dashboard
    networks:
      - monitor_network
    restart: always

# ==============================================================================
# VOLUMES & STORAGE SPECIFICATIONS
# ==============================================================================
volumes:
  # Persistent Volume Storage: Safeguards operational metrics data on host disk
  postgres_data: 

# ==============================================================================
# ISOLATED SOFTWARE NETWORK TOPOLOGY
# ==============================================================================
networks:
  # Isolated Internal Network Bridge: Secures internal cluster data channels
  monitor_network:
    driver: bridge