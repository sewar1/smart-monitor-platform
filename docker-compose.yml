version: '3.8'

services:
  # ==============================================================================
  # Container 1: Production-Grade Relational Database Engine (PostgreSQL)
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: smart_monitor_db
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: secure_devops_pass
      POSTGRES_DB: monitor_db
    ports:
      - "5433:5432" # Binds external port 5433 to avoid host Windows PostgreSQL conflicts
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql # Ticket 1 : Initializes the database with necessary schemas and tables on first run
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - monitor_network
     

  # ==============================================================================
  # Container 2: Flask Telemetry API Engine & Central Dashboard Core
  # ==============================================================================
  dashboard:
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    container_name: smart_monitor_dashboard
    restart: always
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres_admin
      - POSTGRES_PASSWORD=secure_devops_pass
      - POSTGRES_DB=monitor_db
      - POSTGRES_PORT=5432
      - JWT_SECRET_KEY=super_secure_telemetry_secret_key_2026
    depends_on:
      - db
    networks:
      - monitor_network
    pid: "host" # Ticket 5

  # ==============================================================================
  # Container 3: Internal Software Topology Monitoring Agent
  # ==============================================================================
  agent_container:
    build:
      context: ./agent  # References the localized agent subfolder context
      dockerfile: Dockerfile
    container_name: smart_monitor_agent_docker
    restart: always
    environment:
      - CENTRAL_SERVER_URL=http://dashboard:5000/api/metrics/receiver # Ticket 2 : Routes traffic through internal Docker network DNS & adds the receiver endpoint to the URL
      - STREAM_INTERVAL_SECONDS=5
      - NODE_ID=Docker_Production_Container # Ticket 3 : Unique node identifier for distributed deployments
      - LOCATION=Ludwigshafen # Ticket 3 : Location identifier for distributed deployments
    depends_on:
      - dashboard
    networks:
      - monitor_network
    pid: "host" # Ticket 5
    privileged: true # Ticket 5

  # ==============================================================================
  # Container 4: Enterprise Nginx Reverse Proxy Server (Frontend Boundary)
  # ==============================================================================
  proxy_server:
    image: nginx:alpine
    container_name: smart_monitor_proxy
    ports:
      - "80:80" # Binds the primary gateway HTTP standard port
    volumes:
      - ./dashboard/templates:/usr/share/nginx/html
      - ./dashboard/static:/usr/share/nginx/html/static
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - dashboard
    networks:
      - monitor_network
    restart: always

# ==============================================================================
# VOLUMES & PERSISTENT STORAGE SPECIFICATIONS
# ==============================================================================
volumes:
  postgres_data: # Persists PostgreSQL data across container restarts and recreations

# ==============================================================================
# ISOLATED SOFTWARE NETWORK TOPOLOGY
# ==============================================================================
networks:
  monitor_network:
    driver: bridge # Defines an isolated bridge network for inter-container communication without exposing internal services to the host network