services:
  # ==============================================================================
  # Database Service: PostgreSQL 15 persistent data storage
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: smart_monitor_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Local development port mapping (can be omitted in strict production)
    volumes:
      - ./backend/src/main/resources/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - monitor_network
      # Healthcheck to ensure PostgreSQL is ready before dependent services start
    deploy:
      resources:
        limits:
          cpus: '0.75' # Limit CPU usage to 75% of a single core for the database container
          memory: 768M # Limit memory usage to 768MB for the database container
    # Healthcheck configuration for PostgreSQL to ensure the service is ready before other dependent services start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==============================================================================
  # Backend Service: Spring Boot REST API Engine
  # ==============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart_monitor_backend
    restart: always
    ports:
      - "5001:8082"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=5432
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitor_network
    # 
    deploy:
      resources:
        limits:
          cpus: '1.0' # Limit CPU usage to 100% of a single core for the backend container
          memory: 1G # Limit memory usage to 1GB for the backend container

  # ==============================================================================
  # Monitoring Agent: Local Docker-integrated telemetry collector
  # ==============================================================================
  agent_container:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: smart_monitor_agent_docker
    restart: always
    environment:
      - CENTRAL_SERVER_URL=http://backend:8082/api/metrics/receiver
      - NODE_ID=Docker_Production_Container
      - NODE_LOCATION=Ludwigshafen
    depends_on:
      - backend
    networks:
      - monitor_network
    pid: "host"
    privileged: true

  # ==============================================================================
  # Monitoring Agent: External node simulation (Heidelberg)
  # ==============================================================================
  agent_heidelberg:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: smart_monitor_agent_heidelberg
    restart: always
    environment:
      - CENTRAL_SERVER_URL=http://backend:8082/api/metrics/receiver
      - STREAM_INTERVAL_SECONDS=5
      - NODE_ID=VMware_Ubuntu
      - NODE_LOCATION=Heidelberg
    depends_on:
      - backend
    networks:
      - monitor_network

  # ==============================================================================
  # Proxy Server: Nginx acting as Edge Gateway for Frontend & API (SSL/TLS Ready)
  # ==============================================================================
  proxy_server:
    image: nginx:alpine
    container_name: smart_monitor_proxy
    ports:
      - "80:80"
      - "443:443" # Expose HTTPS port for secure communication
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl # Mounted self-signed/PKI certificates directory
    depends_on:
      - backend
    networks:
      - monitor_network
    restart: always

# ==============================================================================
# Global Infrastructure Configuration
# ==============================================================================
volumes:
  postgres_data:

networks:
  monitor_network:
    driver: bridge