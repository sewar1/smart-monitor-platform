services:
  # ==============================================================================
  # Database Service: PostgreSQL 15 persistent data storage
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: smart_monitor_db
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: secure_devops_pass
      POSTGRES_DB: monitor_db
    ports:
      - "5433:5432"
    volumes:
      - ./backend/src/main/resources/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql # Initialize the database with a custom SQL script for schema and data setup
      - postgres_data:/var/lib/postgresql/data # Persist PostgreSQL data to a named volume for durability across container restarts
    restart: always
    networks:
      - monitor_network

  # ==============================================================================
  # Backend Service: Spring Boot REST API Engine
  # ==============================================================================
  backend:
    build:
      context: . # Set the build context to the root of the project , because .mvn and mvnw are located in the root directory, not in the backend directory. This allows the Docker build process to access these files for building the backend service.
      dockerfile: backend/Dockerfile # because the Dockerfile is located in the backend directory, we specify its path relative to the build context. This ensures that Docker uses the correct Dockerfile for building the backend service.
    container_name: smart_monitor_backend
    restart: always
    ports:
      - "5001:8082" # Expose the backend service on port 5001 of the host machine, mapping it to port 8082 inside the container where the Spring Boot application runs.
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres_admin
      - POSTGRES_PASSWORD=secure_devops_pass
      - POSTGRES_DB=monitor_db
      - POSTGRES_PORT=5432
      - JWT_SECRET_KEY=super_secure_telemetry_secret_key_2026
    depends_on:
      - db
    networks:
      - monitor_network
    #volumes:
    #  - .:/app # to enable live code updates during development in ubuntu, but not recommended for production due to performance and security concerns

  # ==============================================================================
  # Monitoring Agent: Local Docker-integrated telemetry collector
  # ==============================================================================
  agent_container:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: smart_monitor_agent_docker
    restart: always
    environment:
      - CENTRAL_SERVER_URL=http://backend:8082/api/metrics/receiver
      - NODE_ID=Docker_Production_Container
      - NODE_LOCATION=Ludwigshafen
    depends_on:
      - backend
    networks:
      - monitor_network
    pid: "host"
    privileged: true

  # ==============================================================================
  # Monitoring Agent: External node simulation (Heidelberg)
  # ==============================================================================
  agent_heidelberg:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: smart_monitor_agent_heidelberg
    restart: always
    environment:
      - CENTRAL_SERVER_URL=http://backend:8082/api/metrics/receiver
      - STREAM_INTERVAL_SECONDS=5
      - NODE_ID=VMware_Ubuntu
      - NODE_LOCATION=Heidelberg
    depends_on:
      - backend
    networks:
      - monitor_network

  # ==============================================================================
  # Proxy Server: Nginx acting as Edge Gateway for Frontend & API
  # ==============================================================================
  proxy_server:
    image: nginx:alpine
    container_name: smart_monitor_proxy
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - monitor_network
    restart: always

# ==============================================================================
# Global Infrastructure Configuration
# ==============================================================================
volumes:
  postgres_data: # Persists PostgreSQL database state

networks:
  monitor_network:
    driver: bridge # Isolated network for container inter-communication