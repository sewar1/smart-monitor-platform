events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # 1. serve the React frontend application
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. to proxy API requests to the Flask backend
        location /api { # - location /api/- remove the trailing slash to avoid double slashes in the proxied URL
            proxy_pass http://dashboard:5000; # - http://dashboard:5000/ - remove the trailing slash to avoid double slashes in the proxied URL
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}