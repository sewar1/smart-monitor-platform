events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning for Metrics Streaming
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # 1. Serve the Frontend Application State (Ticket 1 Base)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Proxy API Requests to the Flask Backend Container (Ticket 2 Fixed)
        # Handles telemetry ingestion under the unified /api/metrics/receiver path
        location /api { 
            # proxy_pass http://dashboard:5000; # Docker
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            
            # WebSockets and Persistent Session Keep-Alive Headers Configuration
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Extended Buffers for High-Frequency Telemetry Ingestion (JSONB Footprints)
            proxy_connect_timeout       10s;
            proxy_send_timeout          10s;
            proxy_read_timeout          10s; # Prevents Nginx from killing slow DB resolution hits
            
            # Security Hardening: Pass real client IP maps down to the Flask logging layer
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}