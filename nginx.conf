user nginx; # Run Nginx as the unprivileged 'nginx' user for security hardening
worker_processes auto; # Dynamically scale worker processes based on CPU cores for optimal performance
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { 
    worker_connections 1024; 
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with real client IP mapping
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance Tuning for Metrics Streaming & Assets
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression for High-Frequency Telemetry & Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zone to Protect Against Brute-Force & DDoS at Proxy Level
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # HTTP Server Block: Redirect all unencrypted traffic to HTTPS
    server {
        listen 80;
        server_name localhost;
        
        return 301 https://$host$request_uri;
    }

    # HTTPS Secure Server Block (Enterprise PKI / Self-Signed ready)
    server {
        listen 443 ssl; # Enable SSL/TLS for secure communication
        server_name localhost;

        # SSL Certificates Configuration (Mounted via Docker Volume)
        ssl_certificate /etc/nginx/ssl/server.crt; # Path to the SSL certificate file
        ssl_certificate_key /etc/nginx/ssl/server.key; # Path to the SSL private key file

        # Modern SSL Security Protocols & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Modern Security Headers (Clickjacking, MIME-Sniffing, XSS protection)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 1. Serve the Frontend Application State with Aggressive Asset Caching
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache hashed static assets safely
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # 2. Dedicated WebSocket Location Block (Fixed routing bug)
        location /ws { # WebSocket endpoint for real-time telemetry streaming
            proxy_pass http://backend:8082; # Proxy to Spring Boot backend for WebSocket connections
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 3. Proxy API Requests to the Spring Boot Backend Container with Rate Limiting
        location /api { 
            limit_req zone=api_limit burst=20 nodelay; # Apply rate limiting to API requests to mitigate brute-force attacks and DDoS attempts
            
            proxy_pass http://backend:8082; 

            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Extended Buffers for High-Frequency Telemetry Ingestion
            proxy_connect_timeout       10s;
            proxy_send_timeout          10s;
            proxy_read_timeout          10s; 
            
            # Security Hardening: Pass real client IP maps down to the Spring Boot layer
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}