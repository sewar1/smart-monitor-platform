<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         META CONFIGURATION
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Monitor Platform</title>

    <!-- ==========================================
         BOOTSTRAP
    ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ==========================================
         CHART.JS
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ==========================================
         CUSTOM STYLES
    ========================================== -->

    <style>

        /* ==========================================
           GLOBAL THEME
        ========================================== */

        body {
            background-color: #0b1220;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* ==========================================
           HEADER
        ========================================== */

        .header {
            text-align: center;
            padding: 18px;
            font-size: 26px;
            font-weight: bold;
            background: #111a2e;
            border-bottom: 1px solid #1f2a44;
            margin-bottom: 20px;
        }

        /* ==========================================
           CARDS
        ========================================== */

        .card-box {
            background: #111a2e;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.4);
        }

        /* ==========================================
           METRIC LABELS
        ========================================== */

        .label {
            color: #9aa4b2;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
            color: #2ee59d;
        }

        /* ==========================================
           HEALTH STATUS COLORS
        ========================================== */

        .healthy {
            color: #2ee59d;
        }

        .warning {
            color: #ffc107;
        }

        .critical {
            color: #ff4d4d;
        }

        /* ==========================================
           ALERT BOX
        ========================================== */

        .alert-box {
            display: none;
            background: #ff3b3b;
            color: white;
            padding: 12px;
            margin: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        /* ==========================================
           TABLES
        ========================================== */

        table {
            margin-top: 10px;
        }

        th {
            color: #9aa4b2;
        }

        td {
            vertical-align: middle;
        }

        /* ==========================================
           CHART
        ========================================== */

        .chart-container {
            height: 60vh;
        }

        /* ==========================================
           ALERT HISTORY
        ========================================== */

        .history-container {
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
        }

        .history-item {
            color: #ffb347;
            margin-bottom: 8px;
            border-bottom: 1px solid #1f2a44;
            padding-bottom: 6px;
        }

    </style>

</head>

<body>

<!-- ==========================================
     HEADER
========================================== -->

<div class="header">

    📡 SMART MONITOR PLATFORM

</div>

<!-- ==========================================
     ALERT BOX
========================================== -->

<div
    id="alertBox"
    class="alert-box"
></div>

<!-- ==========================================
     METRIC CARDS
========================================== -->

<div class="container-fluid">

    <div class="row">

        <!-- CPU -->

        <div class="col-md-3">

            <div class="card-box text-center">

                <div class="label">
                    CPU USAGE
                </div>

                <div
                    class="value"
                    id="cpu"
                >
                    0%
                </div>

            </div>

        </div>

        <!-- RAM -->

        <div class="col-md-3">

            <div class="card-box text-center">

                <div class="label">
                    RAM USAGE
                </div>

                <div
                    class="value"
                    id="ram"
                >
                    0%
                </div>

            </div>

        </div>

        <!-- DISK -->

        <div class="col-md-3">

            <div class="card-box text-center">

                <div class="label">
                    DISK USAGE
                </div>

                <div
                    class="value"
                    id="disk"
                >
                    0%
                </div>

            </div>

        </div>

        <!-- HEALTH -->

        <div class="col-md-3">

            <div class="card-box text-center">

                <div class="label">
                    SYSTEM HEALTH
                </div>

                <div
                    class="value"
                    id="health-score"
                >
                    0
                </div>

                <div id="health-status">
                    Unknown
                </div>

            </div>

        </div>

    </div>

</div>

<!-- ==========================================
     ADVANCED ANALYTICS
========================================== -->

<div class="container-fluid">

    <div class="row">

        <!-- ACTIVE ALERTS -->

        <div class="col-lg-4">

            <div class="card-box">

                <h4>🚨 Active Alerts</h4>

                <div id="alerts-container">

                    <p class="healthy">
                        No active alerts
                    </p>

                </div>

            </div>

        </div>

        <!-- TOP CPU PROCESSES -->

        <div class="col-lg-4">

            <div class="card-box">

                <h4>🔥 Top CPU Processes</h4>

                <table
                    class="table table-dark table-hover table-sm"
                >

                    <thead>

                        <tr>
                            <th>Process</th>
                            <th>CPU%</th>
                        </tr>

                    </thead>

                    <tbody id="cpu-processes"></tbody>

                </table>

            </div>

        </div>

        <!-- TOP RAM PROCESSES -->

        <div class="col-lg-4">

            <div class="card-box">

                <h4>🧠 Top RAM Processes</h4>

                <table
                    class="table table-dark table-hover table-sm"
                >

                    <thead>

                        <tr>
                            <th>Process</th>
                            <th>RAM%</th>
                        </tr>

                    </thead>

                    <tbody id="memory-processes"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- ==========================================
     ALERT HISTORY
========================================== -->

<div class="container-fluid mt-4">

    <div class="card-box">

        <h4>📜 Recent Alert History</h4>

        <div
            id="alert-history"
            class="history-container"
        >

            <p class="healthy">
                No alert history available
            </p>

        </div>

    </div>

</div>

<!-- ==========================================
     REAL-TIME CHART
========================================== -->

<div class="container-fluid">

    <div class="card-box">

        <div class="chart-container">

            <canvas id="chart"></canvas>

        </div>

    </div>

</div>

<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script>

    // ==========================================
    // CHART DATA STORAGE
    // ==========================================

    let labels = [];

    let cpuData = [];

    let ramData = [];

    let diskData = [];

    // ==========================================
    // CHART INITIALIZATION
    // ==========================================

    const ctx =
        document
            .getElementById("chart")
            .getContext("2d");

    const chart = new Chart(ctx, {

        type: "line",

        data: {

            labels: labels,

            datasets: [

                {
                    label: "CPU %",
                    borderColor: "#ff4d4d",
                    data: cpuData,
                    tension: 0.3,
                    fill: false,
                    pointRadius: 2
                },

                {
                    label: "RAM %",
                    borderColor: "#4da6ff",
                    data: ramData,
                    tension: 0.3,
                    fill: false,
                    pointRadius: 2
                },

                {
                    label: "DISK %",
                    borderColor: "#2ee59d",
                    data: diskData,
                    tension: 0.3,
                    fill: false,
                    pointRadius: 2
                }

            ]
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            animation: false,

            scales: {

                y: {
                    min: 0,
                    max: 100
                }

            }

        }

    });

    // ==========================================
    // FETCH METRICS
    // ==========================================

    async function fetchData() {

        try {

            const response =
                await fetch("/api/metrics");

            const json =
                await response.json();

            const node =
                json.nodes[0];

            // ==========================================
            // UPDATE METRIC CARDS
            // ==========================================

            document.getElementById("cpu").innerText =
                node.cpu.toFixed(1) + "%";

            document.getElementById("ram").innerText =
                node.ram.toFixed(1) + "%";

            document.getElementById("disk").innerText =
                node.disk.toFixed(1) + "%";

            // ==========================================
            // HEALTH SCORE
            // ==========================================

            document.getElementById("health-score").innerText =
                json.health.score;

            const healthStatus =
                document.getElementById("health-status");

            healthStatus.innerText =
                json.health.status;

            healthStatus.className = "";

            if (json.health.status === "Healthy") {

                healthStatus.classList.add("healthy");

            }

            else if (json.health.status === "Warning") {

                healthStatus.classList.add("warning");

            }

            else {

                healthStatus.classList.add("critical");

            }

            // ==========================================
            // ALERT BOX
            // ==========================================

            const alertBox =
                document.getElementById("alertBox");

            if (json.alerts.length > 0) {

                alertBox.style.display = "block";

                alertBox.innerText =
                    "⚠ HIGH RESOURCE USAGE DETECTED";

            }

            else {

                alertBox.style.display = "none";

            }

            // ==========================================
            // ACTIVE ALERTS
            // ==========================================

            const alertsContainer =
                document.getElementById("alerts-container");

            if (json.alerts.length === 0) {

                alertsContainer.innerHTML =
                    `<p class="healthy">No active alerts</p>`;

            }

            else {

                alertsContainer.innerHTML =
                    json.alerts
                        .map(alert => `
                            <p class="critical">
                                ${alert}
                            </p>
                        `)
                        .join("");

            }

            // ==========================================
            // TOP CPU PROCESSES
            // ==========================================

            const cpuTable =
                document.getElementById("cpu-processes");

            cpuTable.innerHTML =
                json.processes.top_cpu
                    .map(process => `
                        <tr>
                            <td>${process.name || "Unknown"}</td>
                            <td>${process.cpu.toFixed(1)}%</td>
                        </tr>
                    `)
                    .join("");

            // ==========================================
            // TOP RAM PROCESSES
            // ==========================================

            const memoryTable =
                document.getElementById("memory-processes");

            memoryTable.innerHTML =
                json.processes.top_memory
                    .map(process => `
                        <tr>
                            <td>${process.name || "Unknown"}</td>
                            <td>${process.memory.toFixed(1)}%</td>
                        </tr>
                    `)
                    .join("");

            // ==========================================
            // UPDATE CHART
            // ==========================================

            const time =
                new Date().toLocaleTimeString();

            labels.push(time);

            cpuData.push(node.cpu);

            ramData.push(node.ram);

            diskData.push(node.disk);

            // Keep last 25 points only

            if (labels.length > 25) {

                labels.shift();

                cpuData.shift();

                ramData.shift();

                diskData.shift();

            }

            chart.update();

        }

        catch (error) {

            console.error(
                "Failed to fetch metrics:",
                error
            );

        }

    }

    // ==========================================
    // FETCH ALERT HISTORY
    // ==========================================

    async function fetchAlertHistory() {

        try {

            const response =
                await fetch("/api/alerts/history");

            const json =
                await response.json();

            const historyContainer =
                document.getElementById("alert-history");

            if (json.history.length === 0) {

                historyContainer.innerHTML = `
                    <p class="healthy">
                        No alert history available
                    </p>
                `;

                return;

            }

            const reversedHistory =
                json.history.reverse();

            historyContainer.innerHTML =
                reversedHistory
                    .map(log => `
                        <p class="history-item">
                            ${log}
                        </p>
                    `)
                    .join("");

        }

        catch (error) {

            console.error(
                "Failed to fetch alert history:",
                error
            );

        }

    }

    // ==========================================
    // AUTO REFRESH
    // ==========================================

    fetchData();

    fetchAlertHistory();

    setInterval(fetchData, 2000);

    setInterval(fetchAlertHistory, 5000);

</script>

</body>

</html>
