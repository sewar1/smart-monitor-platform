name: CI/CD Pipeline

# Runs on every push and pull request targeting the main integration branches.
on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

# Cancel older in-progress runs for the same branch/PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  AGENT_IMAGE: ${{ github.repository }}/agent

jobs:
  # ============================================================================
  # 1. SECRET SCANNING — runs first and blocks everything else.
  #    This is the single step that would have caught the JWT_SECRET_KEY /
  #    POSTGRES_PASSWORD leak in docker-compose.yml automatically on every push.
  # ============================================================================
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan past commits too

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 2. BACKEND TESTS (Java / Spring Boot)
  # ============================================================================
  backend-test:
    name: Backend Tests & Coverage (Java)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # REMOVED: "Grant execute permission for Maven wrapper" (chmod +x backend/mvnw)
      # is no longer needed here. Neither Maven step below still invokes the
      # wrapper script — both now use the plain `mvn` binary that's
      # pre-installed on GitHub-hosted ubuntu-latest runners, which sidesteps
      # the wrapper's broken .mvn/wrapper/maven-wrapper.properties lookup
      # entirely (see the comment on the test step below for the root cause).

      # CHANGED: Switched from `./mvnw` (Maven Wrapper) to the plain `mvn`
      # command, which is pre-installed on GitHub-hosted ubuntu-latest runners.
      # Root cause of the previous failure: backend/mvnw expects a sibling
      # `.mvn/wrapper/maven-wrapper.properties` file next to itself (i.e.
      # backend/.mvn/wrapper/...), but that folder actually lives at the repo
      # root instead — a structural mismatch in the repository, not a CI bug.
      # Using the runner's built-in Maven sidesteps that entirely.
      - name: Run unit tests & generate coverage report
        run: mvn test
        working-directory: ./backend

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: OWASP dependency vulnerability check
        # Flags known CVEs in third-party libraries (e.g. jjwt, Spring Security).
        # continue-on-error keeps this informational for now; flip to `false`
        # once the baseline is clean, so new critical CVEs actually fail the build.
        # CHANGED: same fix as the test step above — use the runner's
        # pre-installed `mvn` instead of the broken `./mvnw` wrapper, since
        # `.mvn/wrapper/maven-wrapper.properties` doesn't live inside backend/.
        run: mvn org.owasp:dependency-check-maven:check
        working-directory: ./backend
        continue-on-error: true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 14

  # ============================================================================
  # 3. FRONTEND LINT & BUILD (React / TypeScript)
  #    Previously: zero automated validation existed for the frontend at all.
  # ============================================================================
  frontend-test:
    name: Frontend Lint & Build (React/TS)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run linter
        run: npm run lint
        working-directory: ./frontend

      - name: Build production bundle
        run: npm run build
        working-directory: ./frontend

  # ============================================================================
  # 4. AGENT TESTS (Python)
  #    Previously: test_agent.py existed but was never run in CI at all.
  # ============================================================================
  agent-test:
    name: Agent Tests (Python)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      # CHANGED: `pytest` was missing from agent/requirements.txt, which is
      # why this job previously failed with "pytest: command not found"
      # (exit code 127). requirements.txt has been fixed separately —
      # this step itself did not need to change, it now simply installs
      # a complete dependency list.
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./agent

      - name: Run tests
        run: pytest test_agent.py -v
        working-directory: ./agent

  # ============================================================================
  # 5. BUILD & PUSH DOCKER IMAGES — this is the actual "CD" half of the pipeline.
  #    Only runs on a real push to main/master (not on pull requests), and only
  #    after all three test jobs above succeed.
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-test, agent-test ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend image)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (agent image)
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build & push agent image
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 6. IMAGE VULNERABILITY SCAN — scans the freshly built image before anyone
  #    considers it "released". Fails the pipeline on CRITICAL findings.
  # ============================================================================
  image-scan:
    name: Scan Docker Image (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'   # fail the build on critical/high findings